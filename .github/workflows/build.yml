name: Build Crime Bot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      P4A_RELEASE: "2025.04.01"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config cmake \
            libffi-dev libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3"
          python -m pip install "python-for-android==${P4A_RELEASE}"

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        run: |
          p4a apk \
            --private . \
            --package=org.adrin.crimebot \
            --name="Crime Bot 2.0" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --requirements=python3==3.11.10,kivy \
            --arch=arm64-v8a \
            --android-api=35 \
            --ndk-api=24 \
            --debug

      - name: Locate APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Crime-Bot-APK
          path: "**/*.apk"
          if-no-files-found: error
